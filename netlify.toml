[build]
  command = "npm run build"
  publish = "."

# Security + caching headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# 1. Explicitly map category clean URLs to .html files
[[redirects]]
  from = "/blog/category/*"
  to = "/blog/category/:splat.html"
  status = 200
  force = false

# 2. Explicitly map individual blog post clean URLs to .html files
[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200
  force = false

# 3. Explicitly map top-level pages (e.g. /about -> /about.html)
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# 4. Fallback to the custom 404 page for unmatched routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
