name: Daily Auto Publish Blog Post

on:
  schedule:
    # 12:00 AM Bangladesh Time (BST = UTC+6) -> 18:00 UTC previous day
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run daily publisher
        run: node scripts/publish-daily.js

      - name: Commit and push changes
        run: |
          git config --local user.name github-actions[bot]
          git config --local user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --staged --quiet; then
            echo No changes to commit (queue might be empty).
          else
            git commit -m Auto-publish daily blog post [skip ci]
            git push origin main
          fi
